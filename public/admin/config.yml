# Redaktionssystem für doktura.de (Sveltia CMS, kompatibel mit Decap CMS)
# Aufruf: https://doktura.de/admin
# Jede Änderung wird als Commit auf GitHub gespeichert; Netlify baut die Seite danach automatisch neu (1–2 Minuten).

backend:
  name: github
  repo: Doktura/doktura-web
  branch: main
  # Login läuft über Netlify (GitHub-OAuth-Provider unter Netlify → Access & security → OAuth)
  base_url: https://api.netlify.com
  site_domain: doktura.de
  commit_messages:
    update: 'Text geändert: {{slug}}'

locale: de
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: startseite
    label: Startseite
    description: Alle Texte der Startseite, von oben nach unten.
    format: json
    files:
      - name: hero
        label: '1 · Kopfbereich (ganz oben)'
        file: src/content/startseite/01-hero.json
        fields:
          - { name: kicker, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titelZeile1, label: 'Überschrift, Zeile 1', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: titelZeile2, label: 'Überschrift, Zeile 2', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: button, label: 'Button-Text (öffnet die Terminbuchung)', widget: string }
          - { name: link, label: 'Link-Text neben dem Button', widget: string }
          - { name: karteLabel, label: 'Ansprechpartner-Karte: kleine Zeile', widget: string }
          - { name: karteName, label: 'Ansprechpartner-Karte: Name', widget: string }
          - { name: karteRolle, label: 'Ansprechpartner-Karte: Rolle', widget: string }
          - { name: vorteile, label: 'Vorteile (Leiste mit Häkchen)', widget: list, field: { name: vorteil, label: Vorteil, widget: string } }

      - name: ueber-uns
        label: '2 · Wer wir sind'
        file: src/content/startseite/02-ueber-uns.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: text, label: 'Text', widget: text, hint: 'Leerzeile = neuer Absatz · *Wort* = kursiv · [Linktext](/seite) = Link' }
          - { name: statement, label: 'Großes Statement (füllt sich beim Scrollen)', widget: text }
          - { name: statementGold, label: 'Wort im Statement, das golden erscheint', widget: string, required: false, hint: 'Genau ein Wort aus dem Statement, oder leer lassen.' }

      - name: leistungen
        label: '3 · Leistungen'
        file: src/content/startseite/03-leistungen.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: leistungen
            label: Leistungen
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - name: icon
                label: Symbol
                widget: select
                options:
                  - { label: 'Berufsunfähigkeit', value: bu }
                  - { label: 'Praxis', value: praxis }
                  - { label: 'Optimierung', value: optimierung }
                  - { label: 'Waage', value: waage }
                  - { label: 'Steuer', value: steuer }
                  - { label: 'Kapitalanlage', value: anlage }
                  - { label: 'Vorsorge', value: vorsorge }
                  - { label: 'Liquidität', value: liquiditaet }
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }

      - name: phasen
        label: '4 · Phasen der Praxis'
        file: src/content/startseite/04-phasen.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: phasen
            label: Phasen
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
              - { name: themen, label: 'Themen (kleine Schlagworte)', widget: list, field: { name: thema, label: Thema, widget: string } }

      - name: zamin
        label: '5 · Zamin (Ansprechpartner)'
        file: src/content/startseite/05-zamin.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: text, label: 'Vorstellungstext', widget: text, hint: 'Leerzeile = neuer Absatz · *Wort* = kursiv · [Linktext](/seite) = Link' }
          - name: fakten
            label: 'Fakten (Werdegang, Qualifikationen …)'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Bezeichnung', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: button, label: 'Button-Text', widget: string }
          - { name: zitat, label: 'Zitat', widget: text, required: false, hint: 'Leer lassen blendet das Zitat aus.' }
          - { name: zitatUnterschrift, label: 'Unterschrift unter dem Zitat', widget: string, required: false }

      - name: warum
        label: '6 · Drei Gründe & Transparenz (Gründe erscheinen unter „Über uns“, Transparenz über den häufigen Fragen)'
        file: src/content/startseite/06-warum.json
        fields:
          - { name: titel, label: 'Überschrift über den drei Gründen', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: punkte
            label: 'Drei Gründe'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: transparenzLabel, label: 'Transparenz: kleine Zeile', widget: string }
          - { name: transparenzTitel, label: 'Transparenz: Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: transparenzText, label: 'Transparenz: Einleitung', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: transparenz
            label: 'Transparenz: Punkte'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }

      - name: ablauf
        label: '7 · Ablauf & Erstgespräch'
        file: src/content/startseite/07-ablauf.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: schritte
            label: Schritte
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: erstgespraechTitel, label: 'Erstgespräch: Überschrift', widget: string }
          - { name: erstgespraechText, label: 'Erstgespräch: Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: button, label: 'Button-Text', widget: string }
          - name: details
            label: 'Erstgespräch: Details'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Bezeichnung', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }

      - name: infektionsklausel
        label: '8 · Infektionsklausel (Hinweis unter den Phasen)'
        file: src/content/startseite/08-infektionsklausel.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: button, label: 'Button-Text', widget: string }

      - name: faq
        label: '9 · Häufige Fragen'
        file: src/content/startseite/09-faq.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - name: fragen
            label: Fragen
            widget: list
            summary: '{{fields.frage}}'
            fields:
              - { name: frage, label: 'Frage', widget: string }
              - { name: antwort, label: 'Antwort', widget: text, hint: 'Leerzeile = neuer Absatz · *Wort* = kursiv · [Linktext](/seite) = Link' }

      - name: kontakt
        label: '10 · Kontakt'
        file: src/content/startseite/10-kontakt.json
        fields:
          - { name: label, label: 'Kontakt: kleine Zeile', widget: string }
          - { name: titel, label: 'Kontakt: Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: text, label: 'Kontakt: Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird als Platzhalter markiert' }
          - { name: button, label: 'Kontakt: Button-Text', widget: string }

  - name: landingpage
    label: Anzeigen-Landingpage
    description: 'Der Fragen-Funnel unter doktura.de/erstgespraech, auf den die Meta-Anzeigen verlinken. Bitte keine Ausrufezeichen und keine Aussagen wie „garantiert“ oder „Steuern sparen“ (§ 34d / Meta-Regeln).'
    format: json
    files:
      - name: erstgespraech
        label: 'Fragen-Funnel /erstgespraech'
        file: src/content/erstgespraech.json
        fields:
          - { name: kicker, label: 'Start: kleine Zeile über der Überschrift', widget: string }
          - { name: titelZeile1, label: 'Start: Überschrift, Zeile 1', widget: string, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: titelZeile2, label: 'Start: Überschrift, Zeile 2', widget: string, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: einleitung, label: 'Start: Einleitungstext', widget: text, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: startButton, label: 'Start: Button-Text', widget: string }
          - { name: startHinweis, label: 'Start: kleiner Text neben dem Button', widget: string }
          - { name: vorteile, label: 'Start: Vorteile mit Häkchen', widget: list, field: { name: vorteil, label: Vorteil, widget: string } }
          - name: fragen
            label: 'Fragen (je eine pro Schritt)'
            widget: list
            fields:
              - { name: feld, label: 'Interner Name (nicht ändern, steht so in den Formular-Eingängen)', widget: string, pattern: ['^[a-z_]+$', 'Nur Kleinbuchstaben und _'] }
              - { name: frage, label: Frage, widget: string }
              - { name: hinweis, label: 'Kleiner Hinweis unter der Frage', widget: string, required: false }
              - { name: mehrfach, label: 'Mehrere Antworten möglich', widget: boolean, default: false }
              - { name: nurWennFeld, label: 'Nur zeigen, wenn bei Frage … (interner Name)', widget: string, required: false, hint: 'Leer lassen = Frage wird immer gezeigt. Beispiel: situation' }
              - { name: nurWennAntwort, label: '… diese Antwort gewählt wurde', widget: string, required: false, hint: 'Genau wie die Antwort geschrieben, z. B. Niederlassung geplant' }
              - { name: antworten, label: Antworten, widget: list, field: { name: antwort, label: Antwort, widget: string } }
          - { name: kontaktTitel, label: 'Letzter Schritt: Überschrift', widget: string, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: kontaktText, label: 'Letzter Schritt: Text', widget: text, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: formButton, label: 'Letzter Schritt: Button-Text', widget: string }
          - { name: kontaktTextKalender, label: 'Letzter Schritt: Text, sobald ein Kalender-Link eingetragen ist', widget: text }
          - { name: formButtonKalender, label: 'Letzter Schritt: Button-Text mit Kalender-Link', widget: string }
          - { name: formHinweis, label: 'Letzter Schritt: Hinweis unter dem Button', widget: string }
          - { name: dankeTitel, label: 'Danke-Seite: Überschrift', widget: string, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }
          - { name: dankeText, label: 'Danke-Seite: Text', widget: text, hint: '*Wort* = kursiv (Gold) · [Linktext](/seite) = Link' }

  - name: dashboard
    label: Team-Dashboard (intern)
    description: 'Stand des Projekts und Aufgaben für doktura.de/team (mit Passwort geschützt). Nach dem Speichern ist die Seite in 1–2 Minuten aktuell. Achtung: Das Repo auf GitHub ist öffentlich, also keine Kundendaten, Zahlen oder Passwörter eintragen.'
    format: json
    files:
      - name: dashboard
        label: 'Aufgaben, Stand & Zeitplan'
        file: src/content/dashboard.json
        fields:
          - { name: fokus, label: 'Im Fokus (ein, zwei Sätze, was gerade am wichtigsten ist)', widget: text, required: false }
          - { name: countdownTitel, label: 'Countdown: wofür? (z. B. Instagram-Launch)', widget: string }
          - { name: countdownDatum, label: 'Countdown: Datum', widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false }
          - name: todos
            label: Aufgaben
            label_singular: Aufgabe
            widget: list
            summary: '{{fields.wer}} · {{fields.status}} · {{fields.aufgabe}}'
            fields:
              - { name: aufgabe, label: Aufgabe, widget: string }
              - { name: wer, label: 'Wer?', widget: select, options: [Leon, Zamin, Beide], default: Leon }
              - { name: status, label: Status, widget: select, default: offen, options: [{ label: 'Offen', value: offen }, { label: 'In Arbeit', value: arbeit }, { label: 'Wartet (auf jemand anderen)', value: wartet }, { label: 'Erledigt', value: erledigt }] }
              - { name: prio, label: Priorität, widget: select, default: normal, options: [{ label: 'Hoch', value: hoch }, { label: 'Normal', value: normal }, { label: 'Niedrig', value: niedrig }] }
              - { name: bereich, label: Bereich, widget: select, default: Website, options: [Website, Instagram, Video, Meta Ads, Rechtliches, Organisation] }
              - { name: faellig, label: 'Fällig bis', widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, required: false }
              - { name: notiz, label: 'Notiz (optional)', widget: text, required: false }
          - name: checkliste
            label: 'Launch-Checkliste (was wir zum Online-Gehen brauchen)'
            label_singular: Bereich
            widget: list
            summary: '{{fields.bereich}}'
            fields:
              - { name: bereich, label: Bereich, widget: string }
              - name: punkte
                label: Punkte
                label_singular: Punkt
                widget: list
                summary: '{{fields.punkt}}'
                fields:
                  - { name: punkt, label: Punkt, widget: string }
                  - { name: erledigt, label: Erledigt, widget: boolean, default: false }
                  - { name: wer, label: 'Wer ist zuständig?', widget: select, required: false, options: [Leon, Zamin, Beide] }
          - name: meilensteine
            label: Zeitplan
            label_singular: Termin
            widget: list
            summary: '{{fields.datum}} · {{fields.titel}}'
            fields:
              - { name: datum, label: Datum, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false }
              - { name: titel, label: 'Was passiert?', widget: string }

  - name: bilder
    label: Bilder
    description: Fotos und Vorschaubild austauschen. Einfach ein neues Bild hochladen, die Seite verkleinert und optimiert es beim Bauen automatisch.
    format: json
    files:
      - name: bilder
        label: 'Fotos & Vorschaubild'
        file: src/content/bilder.json
        fields:
          - name: portrait
            label: 'Großes Porträt (Abschnitt „Ihr Ansprechpartner“)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Querformat oder Hochformat, mindestens ca. 1200 px breit. Angezeigt wird ein Hochformat-Ausschnitt (4:5), oben bündig – das Gesicht sollte im oberen Drittel und mittig sein.'
          - { name: portraitAlt, label: 'Bildbeschreibung zum Porträt (für Screenreader und Google)', widget: string, hint: 'Kurz beschreiben, was zu sehen ist, z. B. „Zamin Köhler im dunklen Anzug“.' }
          - name: avatar
            label: 'Rundes Bild oben (Ansprechpartner-Karte)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Quadratisch, Gesicht mittig, mindestens 400 × 400 px. Wird rund zugeschnitten.'
          - name: vorschaubild
            label: 'Vorschaubild für geteilte Links (WhatsApp, LinkedIn, Facebook …)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Ideal 1200 × 630 px. Andere Formate werden automatisch auf dieses Format zugeschnitten (Mitte bleibt erhalten). Messenger zeigen ein neues Bild teils erst nach Tagen.'

  - name: einstellungen
    label: Einstellungen
    description: Kontaktdaten, Links und Pflichtangaben (erscheinen im Footer, im Impressum, in der Erstinformation und im Datenschutz).
    format: json
    files:
      - name: einstellungen
        label: 'Kontakt, Links & Rechtliches'
        file: src/content/einstellungen.json
        fields:
          - { name: calUrl, label: 'Terminbuchung (Cal.com-Link)', widget: string, hint: 'Alle Termin-Buttons führen hierhin.' }
          - { name: instagram, label: 'Instagram-Link', widget: string }
          - { name: metaPixelId, label: 'Meta Pixel ID (nur Ziffern)', widget: string, required: false, hint: 'Leer = kein Tracking, kein Cookie-Banner. Mit ID erscheint automatisch das Cookie-Banner; das Pixel lädt nur nach Zustimmung. Datenschutzerklärung wird automatisch ergänzt.' }
          - name: kontakt
            label: Kontakt
            widget: object
            fields:
              - { name: person, label: 'Ansprechpartner', widget: string }
              - { name: email, label: 'E-Mail', widget: string }
              - { name: telefon, label: 'Telefon', widget: string, required: false, hint: 'Leer lassen blendet die Telefonnummer aus.' }
              - { name: adresse, label: 'Adresse (eine Zeile)', widget: string }
          - name: rechtliches
            label: 'Rechtliche Angaben (Änderungen bitte vorher prüfen)'
            widget: object
            fields:
              - { name: firma, label: 'Firmenname', widget: string }
              - { name: rechtsform, label: 'Rechtsform', widget: string }
              - { name: vertreten, label: 'Inhaber / Geschäftsführer', widget: string, hint: 'z. B. „Inhaber: Zamin Köhler“' }
              - { name: handelsregister, label: 'Handelsregister', widget: string, required: false, hint: 'Leer lassen, falls nicht eingetragen.' }
              - { name: ustId, label: 'USt-IdNr.', widget: string, required: false, hint: 'Leer lassen, falls nicht vorhanden.' }
              - { name: erlaubnisse, label: 'Gewerbeerlaubnis(se)', widget: list, field: { name: erlaubnis, label: Erlaubnis, widget: string } }
              - { name: erlaubnisKurz, label: 'Erlaubnis (Kurzform für die Startseite)', widget: string }
              - { name: registernummer, label: 'Vermittlerregister-Nummer', widget: string }
              - { name: ihk, label: 'Zuständige IHK mit Adresse', widget: string }
              - { name: ihkKurz, label: 'IHK (Kurzform für die Startseite)', widget: string }
