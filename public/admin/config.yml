# Redaktionssystem für doktura.de (Sveltia CMS, kompatibel mit Decap CMS)
# Aufruf: https://doktura.de/admin
# Jede Änderung wird als Commit auf GitHub gespeichert; Netlify baut die Seite danach automatisch neu (1–2 Minuten).

backend:
  name: github
  repo: Doktura/doktura-web
  branch: main
  # Login läuft über Netlify (GitHub-OAuth-Provider unter Netlify → Access & security → OAuth)
  base_url: https://api.netlify.com
  site_domain: doktura.de
  commit_messages:
    update: 'Text geändert: {{slug}}'

locale: de
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: startseite
    label: Startseite
    description: Alle Texte der Startseite, von oben nach unten.
    format: json
    files:
      - name: hero
        label: '1 · Kopfbereich (ganz oben)'
        file: src/content/startseite/01-hero.json
        fields:
          - { name: kicker, label: 'Kleine Zeile über der Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titelZeile1, label: 'Überschrift, Zeile 1', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titelZeile2, label: 'Überschrift, Zeile 2 (*Wort* = gold und kursiv)', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: button, label: 'Button-Text (öffnet die Terminbuchung)', widget: string }
          - { name: link, label: 'Link-Text neben dem Button', widget: string }
          - { name: bildName, label: 'Name unter dem Foto', widget: string }
          - { name: bildRolle, label: 'Rolle unter dem Foto', widget: string }
          - { name: vorteile, label: 'Kurze Punkte mit Häkchen', widget: list, field: { name: vorteil, label: Punkt, widget: string } }

      - name: check
        label: '2 · 5-Punkte-Check'
        file: src/content/startseite/02-check.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titel, label: 'Überschrift (*Wort* = gold)', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: einleitung, label: 'Einleitung', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - name: punkte
            label: 'Fragen'
            widget: list
            summary: '{{fields.thema}}'
            fields:
              - { name: thema, label: 'Thema (klein)', widget: string }
              - { name: frage, label: 'Frage', widget: string }
              - { name: antwort, label: 'Antwort (klappt beim Antippen auf)', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: ergebnisKeine, label: 'Text, solange nichts angetippt ist', widget: string }
          - { name: ergebnisEine, label: 'Text bei einem offenen Punkt', widget: string }
          - { name: ergebnisMehrere, label: 'Text bei mehreren offenen Punkten', widget: string, hint: '{n} wird durch die Anzahl ersetzt' }
          - { name: button, label: 'Button-Text', widget: string }

      - name: leistungen
        label: '3 · Leistungen'
        file: src/content/startseite/03-leistungen.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: einleitung, label: 'Einleitungstext', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - name: leistungen
            label: Leistungen
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - name: icon
                label: Symbol
                widget: select
                options:
                  - { label: 'Berufsunfähigkeit', value: bu }
                  - { label: 'Praxis', value: praxis }
                  - { label: 'Optimierung', value: optimierung }
                  - { label: 'Waage', value: waage }
                  - { label: 'Vorsorge', value: vorsorge }
                  - { label: 'Liquidität', value: liquiditaet }
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: phasenTitel, label: 'Zeitleiste: Überschrift', widget: string }
          - { name: phasen, label: 'Zeitleiste: Phasen', widget: list, field: { name: phase, label: Phase, widget: string } }

      - name: zamin
        label: '4 · Zamin (Ansprechpartner)'
        file: src/content/startseite/04-zamin.json
        fields:
          - { name: label, label: 'Kleine Zeile oben', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: zitat, label: 'Zitat (groß, *Wort* = gold)', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: text, label: 'Vorstellungstext', widget: text, hint: 'Leerzeile = neuer Absatz · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - name: fakten
            label: 'Fakten'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Bezeichnung', widget: string }
              - { name: text, label: 'Text', widget: string }
          - { name: button, label: 'Button-Text', widget: string }

      - name: erstgespraech
        label: '5 · Erstgespräch, Ablauf & Kontaktformular'
        file: src/content/startseite/05-erstgespraech.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titel, label: 'Überschrift (*Wort* = gold)', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - name: schritte
            label: 'Schritte'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Titel', widget: string }
              - { name: text, label: 'Text', widget: text }
          - name: details
            label: 'Details (Kosten, Vergütung …)'
            widget: list
            summary: '{{fields.titel}}'
            fields:
              - { name: titel, label: 'Bezeichnung', widget: string }
              - { name: text, label: 'Text', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: formularTitel, label: 'Überschrift über dem Formular (wenn ein Terminlink eingetragen ist)', widget: string }
          - { name: button, label: 'Button-Text Terminbuchung', widget: string }

      - name: faq
        label: '6 · Häufige Fragen'
        file: src/content/startseite/06-faq.json
        fields:
          - { name: label, label: 'Kleine Zeile über der Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - { name: titel, label: 'Überschrift', widget: string, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }
          - name: fragen
            label: 'Fragen'
            widget: list
            summary: '{{fields.frage}}'
            fields:
              - { name: frage, label: 'Frage', widget: string }
              - { name: antwort, label: 'Antwort', widget: text, hint: '*Wort* = kursiv · [Linktext](/seite) = Link · Text in [eckigen Klammern] wird auf der Live-Seite ausgeblendet' }

  - name: bilder
    label: Bilder
    description: Fotos und Vorschaubild austauschen. Einfach ein neues Bild hochladen, die Seite verkleinert und optimiert es beim Bauen automatisch.
    format: json
    files:
      - name: bilder
        label: 'Fotos & Vorschaubild'
        file: src/content/bilder.json
        fields:
          - name: portrait
            label: 'Großes Porträt (Abschnitt „Ihr Ansprechpartner“)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Querformat oder Hochformat, mindestens ca. 1200 px breit. Angezeigt wird ein Hochformat-Ausschnitt (4:5), oben bündig – das Gesicht sollte im oberen Drittel und mittig sein.'
          - { name: portraitAlt, label: 'Bildbeschreibung zum Porträt (für Screenreader und Google)', widget: string, hint: 'Kurz beschreiben, was zu sehen ist, z. B. „Zamin Köhler im dunklen Anzug“.' }
          - name: avatar
            label: 'Rundes Bild oben (Ansprechpartner-Karte)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Quadratisch, Gesicht mittig, mindestens 400 × 400 px. Wird rund zugeschnitten.'
          - name: vorschaubild
            label: 'Vorschaubild für geteilte Links (WhatsApp, LinkedIn, Facebook …)'
            widget: image
            media_folder: /src/assets/images
            public_folder: /src/assets/images
            hint: 'Ideal 1200 × 630 px. Andere Formate werden automatisch auf dieses Format zugeschnitten (Mitte bleibt erhalten). Messenger zeigen ein neues Bild teils erst nach Tagen.'

  - name: einstellungen
    label: Einstellungen
    description: Kontaktdaten, Links und Pflichtangaben (erscheinen im Footer, im Impressum, in der Erstinformation und im Datenschutz).
    format: json
    files:
      - name: einstellungen
        label: 'Kontakt, Links & Rechtliches'
        file: src/content/einstellungen.json
        fields:
          - { name: calUrl, label: 'Terminbuchung (Cal.com-Link)', widget: string, hint: 'Alle Termin-Buttons führen hierhin.' }
          - { name: instagram, label: 'Instagram-Link', widget: string }
          - { name: metaPixelId, label: 'Meta Pixel ID (nur Ziffern)', widget: string, required: false, hint: 'Leer = kein Tracking, kein Cookie-Banner. Mit ID erscheint automatisch das Cookie-Banner; das Pixel lädt nur nach Zustimmung. Datenschutzerklärung wird automatisch ergänzt.' }
          - name: kontakt
            label: Kontakt
            widget: object
            fields:
              - { name: person, label: 'Ansprechpartner', widget: string }
              - { name: email, label: 'E-Mail', widget: string }
              - { name: telefon, label: 'Telefon', widget: string, required: false, hint: 'Leer lassen blendet die Telefonnummer aus.' }
              - { name: adresse, label: 'Adresse (eine Zeile)', widget: string }
          - name: rechtliches
            label: 'Rechtliche Angaben (Änderungen bitte vorher prüfen)'
            widget: object
            fields:
              - { name: firma, label: 'Firmenname', widget: string }
              - { name: rechtsform, label: 'Rechtsform', widget: string }
              - { name: vertreten, label: 'Inhaber / Geschäftsführer', widget: string, hint: 'z. B. „Inhaber: Zamin Köhler“' }
              - { name: handelsregister, label: 'Handelsregister', widget: string, required: false, hint: 'Leer lassen, falls nicht eingetragen.' }
              - { name: ustId, label: 'USt-IdNr.', widget: string, required: false, hint: 'Leer lassen, falls nicht vorhanden.' }
              - { name: erlaubnisse, label: 'Gewerbeerlaubnis(se)', widget: list, field: { name: erlaubnis, label: Erlaubnis, widget: string } }
              - { name: erlaubnisKurz, label: 'Erlaubnis (Kurzform für die Startseite)', widget: string }
              - { name: registernummer, label: 'Vermittlerregister-Nummer', widget: string }
              - { name: ihk, label: 'Zuständige IHK mit Adresse', widget: string }
              - { name: ihkKurz, label: 'IHK (Kurzform für die Startseite)', widget: string }
